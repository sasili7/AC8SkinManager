name: Publish downloads
on:
  push:
    branches: [main]
    paths:
      - 'release-files/**'
      - 'release-base/**'
      - 'tools/assemble_release.py'
      - 'tools/release-delta.json'
      - 'distribution/**'
      - 'work/ac8-skin-manager/src/**'
      - 'docs/RELEASE-NOTES.md'
      - '.github/workflows/publish-download.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-downloads
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Assemble and verify the complete package
        run: python3 tools/assemble_release.py
      - name: Check download hashes
        working-directory: release-files
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view download >/dev/null 2>&1; then
            gh release upload download release-files/* --clobber
            for legacy in default.docx Skin.Author.Guide.docx; do
              if gh release view download --json assets --jq '.assets[].name' | grep -Fxq "$legacy"; then
                gh release delete-asset download "$legacy" --yes
              fi
            done
            gh release edit download --title "AC8 Skin Manager" --notes-file docs/RELEASE-NOTES.md --latest
          else
            gh release create download release-files/* --target "$GITHUB_SHA" --title "AC8 Skin Manager" --notes-file docs/RELEASE-NOTES.md --latest
          fi
